# The system: the task scheduler (package `tsched` in hw/) and the cluster hardware it schedules.
package:
  name: teranoc_ooo

dependencies:
  tsched:  { path: "hw" }
  # TeraMonster: the tiles, DMA engines and L1 of the cluster (package name `mempool`).
  mempool: { git: "https://github.com/liyinrong/TeraNoC.git", rev: monster-dev }

sources:
  - sys/src/tsched_disp_bridge.sv
  - sys/src/tsched_dma_bridge.sv

  # Compiled together with the testbench of the cluster hardware, which instantiates the harness.
  - target: all(simulation, mempool_vsim)
    files:
      - sys/tb/tsched_harness.sv
