# The merge slices for loads that several vector units share (the idea of MergeCast, for one-beat lines).
# No dependencies: the slice can be simulated and measured on its own.
package:
  name: mcast

sources:
  - src/mcast_slice.sv

  - target: any(simulation, test)
    files:
      - tb/tb_mcast_slice.sv
